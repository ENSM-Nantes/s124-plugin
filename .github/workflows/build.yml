name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: s124navwarnings_pi_linux-*.tar.gz
          if-no-files-found: error

  # Native aarch64 hardware (GitHub-hosted ARM64 runner) - covers 64-bit
  # Raspberry Pi OS, which is the default on Pi 4/5 today.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-tarball
          path: s124navwarnings_pi_linux-*.tar.gz
          if-no-files-found: error

  # GitHub has no 32-bit ARM hosted runners, so armhf (older/32-bit Raspberry
  # Pi OS installs) is built under QEMU emulation on a regular x86_64 runner.
  build-linux-armhf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package (armhf, via QEMU)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          env: |
            DEBIAN_FRONTEND=noninteractive
          run: bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-armhf-tarball
          path: s124navwarnings_pi_linux-*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        shell: pwsh
        run: .\build_win.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tarball
          path: s124navwarnings_pi_windows-*.tar.gz
          if-no-files-found: error

  release:
    needs: [build-linux-x86_64, build-linux-arm64, build-linux-armhf, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-tarball'
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: s124navwarnings_pi_*.tar.gz
          generate_release_notes: true
